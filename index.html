        <input type="text" id="campoPesquisa"
               placeholder="Pesquisar jogo..."

    </div>

    <button class="menuTresPontos" onclick="abrirMenu()" aria-label="Abrir menu">⋮</button>

    <div id="menuLateral" class="menuLateral">
        <button class="fecharMenu" onclick="fecharMenu()">✕</button>
        <h2>Menu</h2>
        <button onclick="mostrarPaginaPrincipal()">🎮 Jogos</button>
        <button onclick="mostrarEmuladores()">Emuladores</button>
    </div>
    <div id="fundoMenu" class="fundoMenu" onclick="fecharMenu()"></div>
</header>

    <button onclick="mostrarTodos()">TODOS</button>
    <button onclick="mostrarJogos('PS1')">PS1</button>
    <button onclick="mostrarJogos('PS2')">PS2</button>
    <button onclick="mostrarJogos('SNES')">SNES</button>
    <button onclick="mostrarJogos('GameCube')">GameCube</button>
    <button onclick="mostrarJogos('Sega MD')">Sega MD</button>
</nav>

<main id="paginaJogos">

</main>

<section id="paginaEmuladores" class="paginaEmuladores">
    <h2>Emuladores</h2>
    <p>Emuladores disponíveis para download.</p>

    <div class="listaEmuladores">
        <div class="cardEmulador">
            <h3>Emuladores</h3>
            <p>Adicione aqui seus emuladores e os links para download.</p>
        </div>
    </div>
</section>

        <h2 id="nomeJogo"></h2>

        <p id="consoleJogo"></p>

        <a id="botaoDownload"
           class="download"
           href="#"
           target="_blank">
            DOWNLOAD
        </a>

        <hr>

        <h3>O download funciona?</h3>

        <div class="votosDownload">
            <button class="voto funciona" onclick="votarDownload(true)">
                Download funciona
            </button>

            <button class="voto naoFunciona" onclick="votarDownload(false)">
                Download não funciona
            </button>
        </div>

        <div id="resultadoVotos" class="resultadoVotos"></div>

</div>

/* =================================
        CONFIGURAÇÃO
================================= */

let consoleSelecionado = "TODOS";
let jogoAtual = null;


/* =================================
        MOSTRAR JOGOS
================================= */

function mostrarJogos(consoleNome) {

    consoleSelecionado = consoleNome;

    document.getElementById("tituloConsole").innerText =
        consoleNome;

    pesquisar();
}


function mostrarTodos() {

    consoleSelecionado = "TODOS";

    document.getElementById("tituloConsole").innerText =
        "Todos os jogos";

    pesquisar();
}


/* =================================
        PESQUISA
================================= */

function pesquisar() {

    const texto =
        document.getElementById("campoPesquisa")
        .value
        .toLowerCase();

    let resultado = jogos.filter(jogo => {

        const pertenceAoConsole =
            consoleSelecionado === "TODOS" ||
            jogo.console === consoleSelecionado;

        const correspondePesquisa =
            jogo.nome.toLowerCase().includes(texto);

        return pertenceAoConsole && correspondePesquisa;

    });

    mostrarLista(resultado);
}


/* =================================
        CRIAR CARDS
================================= */

function mostrarLista(lista) {

    const area =
        document.getElementById("listaJogos");

    area.innerHTML = "";

    if (lista.length === 0) {

        area.innerHTML =
            `<p class="nenhum">Nenhum jogo encontrado.</p>`;

        return;
    }

    lista.forEach(jogo => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <img src="${jogo.imagem}"
                 alt="${jogo.nome}"
                 onerror="this.src='images/sem-capa.jpg'">

            <h3>${jogo.nome}</h3>

            <span>${jogo.console}</span>

            <button onclick='abrirJogo(${JSON.stringify(jogo)})'>
                VER JOGO
            </button>

        `;

        area.appendChild(card);

    });
}


/* =================================
        ABRIR JOGO
================================= */

function abrirJogo(jogo) {

    jogoAtual = jogo;

    document.getElementById("imagemJogo").src =
        jogo.imagem;

    document.getElementById("nomeJogo").innerText =
        jogo.nome;

    document.getElementById("consoleJogo").innerText =
        "Console: " + jogo.console;

    document.getElementById("botaoDownload").href =
        jogo.download;

    carregarVotos();

    document.getElementById("janelaJogo")
        .classList.add("ativa");
}


/* =================================
        FECHAR
================================= */

function fecharJogo() {

    document.getElementById("janelaJogo")
        .classList.remove("ativa");
}


/* ===/* =================================
        VOTOS DO DOWNLOAD
================================= */

function carregarVotos() {
    if (!jogoAtual) return;

    const chave = "votos_" + jogoAtual.nome;
    const votos = JSON.parse(localStorage.getItem(chave)) || {
        funciona: 0,
        naoFunciona: 0
    };

    document.getElementById("resultadoVotos").innerText =
        "Funciona: " + votos.funciona +
        " | Não funciona: " + votos.naoFunciona;
}

function votarDownload(funciona) {
    if (!jogoAtual) return;

    const chave = "votos_" + jogoAtual.nome;
    const votos = JSON.parse(localStorage.getItem(chave)) || {
        funciona: 0,
        naoFunciona: 0
    };

    if (funciona) {
        votos.funciona++;
    } else {
        votos.naoFunciona++;
    }

    localStorage.setItem(chave, JSON.stringify(votos));
    carregarVotos();
}


/* =================================
        MENU
================================= */

function abrirMenu() {
    document.getElementById("menuLateral").classList.add("aberto");
    document.getElementById("fundoMenu").classList.add("ativo");
}

function fecharMenu() {
    document.getElementById("menuLateral").classList.remove("aberto");
    document.getElementById("fundoMenu").classList.remove("ativo");
}

function mostrarEmuladores() {
    fecharMenu();

    document.getElementById("paginaJogos").style.display = "none";
    document.getElementById("paginaEmuladores").classList.add("ativa");
}

function mostrarPaginaPrincipal() {
    fecharMenu();

    document.getElementById("paginaEmuladores").classList.remove("ativa");
    document.getElementById("paginaJogos").style.display = "block";
}
