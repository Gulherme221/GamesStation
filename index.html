    <div class="pesquisa">
        <input type="text" id="campoPesquisa"

    <button onclick="mostrarJogos('Sega MD')">Sega MD</button>

    <section id="listaJogos" class="grid"></section>

</main>

        <h2 id="nomeJogo"></h2>

        <p id="consoleJogo"></p>

        <a id="botaoDownload"
           class="download"
           href="#"
           target="_blank">
            ⬇️ DOWNLOAD
        </a>

        <hr>

        <h3>💬 Comentários</h3>

        <div id="comentarios"></div>

        <textarea id="novoComentario"
                  placeholder="Escreva um comentário..."></textarea>

        <button class="enviar"

/* =================================
        CONFIGURAÇÃO
================================= */

let consoleSelecionado = "TODOS";
let jogoAtual = null;


/* =================================
        MOSTRAR JOGOS
================================= */

function mostrarJogos(consoleNome) {

    consoleSelecionado = consoleNome;

    document.getElementById("tituloConsole").innerText =
        consoleNome;

    pesquisar();
}


function mostrarTodos() {

    consoleSelecionado = "TODOS";

    document.getElementById("tituloConsole").innerText =
        "Todos os jogos";

    pesquisar();
}


/* =================================
        PESQUISA
================================= */

function pesquisar() {

    const texto =
        document.getElementById("campoPesquisa")
        .value
        .toLowerCase();

    let resultado = jogos.filter(jogo => {

        const pertenceAoConsole =
            consoleSelecionado === "TODOS" ||
            jogo.console === consoleSelecionado;

        const correspondePesquisa =
            jogo.nome.toLowerCase().includes(texto);

        return pertenceAoConsole && correspondePesquisa;

    });

    mostrarLista(resultado);
}


/* =================================
        CRIAR CARDS
================================= */

function mostrarLista(lista) {

    const area =
        document.getElementById("listaJogos");

    area.innerHTML = "";

    if (lista.length === 0) {

        area.innerHTML =
            `<p class="nenhum">Nenhum jogo encontrado.</p>`;

        return;
    }

    lista.forEach(jogo => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <img src="${jogo.imagem}"
                 alt="${jogo.nome}"
                 onerror="this.src='images/sem-capa.jpg'">

            <h3>${jogo.nome}</h3>

            <span>${jogo.console}</span>

            <button onclick='abrirJogo(${JSON.stringify(jogo)})'>
                VER JOGO
            </button>

        `;

        area.appendChild(card);

    });
}


/* =================================
        ABRIR JOGO
================================= */

function abrirJogo(jogo) {

    jogoAtual = jogo;

    document.getElementById("imagemJogo").src =
        jogo.imagem;

    document.getElementById("nomeJogo").innerText =
        jogo.nome;

    document.getElementById("consoleJogo").innerText =
        "Console: " + jogo.console;

    document.getElementById("botaoDownload").href =
        jogo.download;

    carregarComentarios();

    document.getElementById("janelaJogo")
        .classList.add("ativa");
}


/* =================================
        FECHAR
================================= */

function fecharJogo() {

    document.getElementById("janelaJogo")
        .classList.remove("ativa");
}


/* =================================
        COMENTÁRIOS
================================= */

function carregarComentarios() {

    const area =
        document.getElementById("comentarios");

    area.innerHTML = "";

    const chave =
        "comentarios_" + jogoAtual.nome;

    const comentarios =
        JSON.parse(localStorage.getItem(chave)) || [];

    comentarios.forEach(comentario => {

        const div =
            document.createElement("div");

        div.className = "comentario";

        div.innerText = comentario;

        area.appendChild(div);

    });
}


function adicionarComentario() {

    const campo =
        document.getElementById("novoComentario");

    const texto =
        campo.value.trim();

    if (!texto) return;

    const chave =
        "comentarios_" + jogoAtual.nome;

    const comentarios =
        JSON.parse(localStorage.getItem(chave)) || [];

    comentarios.push(texto);

    localStorage.setItem(
        chave,
        JSON.stringify(comentarios)
    );

    campo.value = "";

    carregarComentarios();
}


/* =================================
        INICIAR
================================= */
